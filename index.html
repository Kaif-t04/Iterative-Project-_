<!DOCTYPE html>
<html lang="en">
<head>
 
    <title>Company Information Retriever</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <main class="container">
        
        <!-- Header Sec here -->
        <header class="header">
            <span class="badge">
                <span class="dot"></span> Internal Lead Gen Tool
            </span>
            <h1>Company Information Retriever</h1>
            <p class="subtitle">Find newly registered Finnish companies for B2B sales outreach and website design prospects.</p>
        </header>

        <!-- main Form -->
        <section class="card">
            <form id="search-form" onsubmit="return false;">
                
                <div class="form-grid">
                    
                    <!-- City Input -->
                    <div class="form-group">
                        <label for="city">City</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-magnifying-glass input-icon"></i>
                            <input type="text" id="city" placeholder="e.g., Kuopio or Lahti">
                        </div>
                    </div>

                    <!-- Business Line Selector -->
                    <div class="form-group">
                        <label for="business-line">Business Line</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-building input-icon"></i>
                            <select id="business-line">
                                <option value="" selected disabled>Select business line</option>
                                <option value="10">10 Agriculture</option>
                                <option value="25">25 Manufacturing</option>
                                <option value="41">41 Construction</option>
                                <option value="47">47 Retail Trade</option>
                                <option value="55">55 Accommodation</option>
                                <option value="56">56 Food & Beverage</option>
                                <option value="62">62 IT Services</option>
                                <option value="69">69 Legal & Accounting</option>
                                <option value="70">70 Design & Consulting</option>
                            </select>
                            <i class="fa-solid fa-chevron-down select-chevron"></i>
                        </div>
                    </div>

                    <!-- Registration Start Date -->
                    <div class="form-group">
                        <label for="start-date">Registration Start Date</label>
                        <div class="input-wrapper">
                            <i class="fa-regular fa-calendar input-icon"></i>
                            <input type="text" id="start-date" placeholder="dd.mm.yyyy">
                        </div>
                    </div>

                    <!-- Registration End Date -->
                    <div class="form-group">
                        <label for="end-date">Registration End Date</label>
                        <div class="input-wrapper">
                            <i class="fa-regular fa-calendar input-icon"></i>
                            <input type="text" id="end-date" placeholder="dd.mm.yyyy">
                        </div>
                    </div>

                </div>

                <!-- Form Action Buttons -->
                <div class="button-group">
                    <button type="submit" class="btn-primary">
                        <i class="fa-solid fa-magnifying-glass"></i> Search
                    </button>
                    <button type="reset" class="btn-secondary">
                        Clear Filters
                    </button>
                </div>

            </form>
        </section>

        <!-- Initial Empty/Helper State Box -->
        <section class="card helper-card">
            <p>Fill in the search criteria above and click <strong>Search</strong> to see results.</p>
        </section>

    </main>

</body>
</html>
